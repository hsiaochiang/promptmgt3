openapi: 3.0.3
info:
  title: Prompt Asset Hub API
  version: 0.1.0
  description: "本機單人模式 API（REST）"
servers:
  - url: http://localhost:3001
paths:
  /api/workspace/settings:
    get:
      summary: 取得工作空間設定
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }
    post:
      summary: 更新工作空間設定
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsUpdate' }
      responses:
        '200': { description: 已更新, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }
        '400': { description: Bad Request（例如路徑不存在、schedule 格式不符）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: Forbidden（例如路徑不可寫）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { description: Internal Server Error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/workspace/permissions:
    get:
      summary: 檢查路徑讀寫權限
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PathPermissions' } } } }
        '400': { description: Bad Request }
  /api/projects:
    get:
      summary: 列出專案（支援篩選/搜尋）
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: archived
          description: 是否包含已封存專案（預設 false）
          schema: { type: boolean, default: false }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Project' } } } } }
    post:
      summary: 新增專案
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
  /api/prompts:
    get:
      summary: 列出提示詞（支援篩選/搜尋/看板）
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: priority
          schema: { type: string }
        - in: query
          name: archived
          description: 是否包含已封存提示詞（預設 false）
          schema: { type: boolean, default: false }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Prompt' } } } } }
    post:
      summary: 新增提示詞
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromptInput' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Prompt' } } } }
  /api/prompts/{id}:
    get:
      summary: 取得提示詞詳情
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Prompt' } } } }
    put:
      summary: 更新提示詞（正文 + 中繼資料）
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromptInput' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Prompt' } } } }
    delete:
      summary: 刪除提示詞（移到回收站，可復原）
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TrashItem' } } } }
        '404': { description: Not Found }

  /api/projects/{id}:
    delete:
      summary: 刪除專案（移到回收站，可復原）
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TrashItem' } } } }
        '404': { description: Not Found }

  /api/trash:
    get:
      summary: 列出回收站項目（可搜尋/篩選）
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: entityType
          schema: { type: string, enum: [project, prompt, inboxItem, snippet, unknown] }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: perPage
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TrashListResponse' } } } }

  /api/trash/{trashId}:
    delete:
      summary: 永久刪除回收站項目（不可復原）
      parameters:
        - in: path
          name: trashId
          required: true
          schema: { type: string }
      responses:
        '204': { description: No Content }
        '404': { description: Not Found }

  /api/trash/{trashId}/restore:
    post:
      summary: 從回收站復原（可能衝突）
      parameters:
        - in: path
          name: trashId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrashRestoreRequest' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TrashRestoreResult' } } } }
        '409': { description: Conflict, content: { application/json: { schema: { $ref: '#/components/schemas/RestoreConflict' } } } }
        '404': { description: Not Found }
  /api/files/read:
    get:
      summary: 讀取檔案
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: string } } } }
  /api/files/write:
    post:
      summary: 寫入檔案（自動保存）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path: { type: string }
                content: { type: string }
      responses:
        '200': { description: OK }
  /api/files/attach:
    post:
      summary: 上傳附件並回傳引用路徑
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                targetPath: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Attachment' } } } }
  /api/inbox:
    get:
      summary: 取得暫存區項目
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/InboxItem' } } } } }
    post:
      summary: 匯入暫存項
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboxImport' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/InboxItem' } } } }
  /api/inbox/{id}:
    get:
      summary: 取得單一暫存項目
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/InboxItem' } } } }
        '404': { description: Not Found }
    put:
      summary: 編輯暫存項（標題/備註/刪減）
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                notes: { type: string }
                rawContent: { type: string }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/InboxItem' } } } }
        '404': { description: Not Found }
    delete:
      summary: 刪除暫存項（永久刪除；不進回收站）
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not Found }
  /api/search:
    post:
      summary: 搜尋資產（title/tags/body；預設只搜 Project/Prompt 且 archived=false，不含 Inbox/Trash）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SearchResponse' } } } }
  /api/snapshots:
    post:
      summary: 建立快照（含附件完整複本）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string }
                scope: { type: string, enum: [workspace, project, prompt] }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/VersionEvent' } } } }
    get:
      summary: 列出快照事件
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/VersionEvent' } } } } }
  /api/versions:
    post:
      summary: 建立指定實體的版本節點
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entityType:
                  type: string
                  enum: [project, prompt]
                entityId: { type: string }
                projectSlug: { type: string }
                promptSlug: { type: string }
                message: { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/VersionEvent' } } } }
    get:
      summary: 列出所有版本節點
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/VersionEvent' } } } } }
  /api/versions/{entityType}/{entityId}:
    get:
      summary: 列出指定實體的版本節點
      parameters:
        - in: path
          name: entityType
          required: true
          schema: { type: string, enum: [project, prompt] }
        - in: path
          name: entityId
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/VersionEvent' } } } } }
        '400': { description: Bad Request }

  /api/snippets:
    get:
      summary: 列出所有片段
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SnippetList' } } } }
    post:
      summary: 新增片段
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SnippetInput' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Snippet' } } } }
        '400': { description: Bad Request }

  /api/snippets/{id}:
    get:
      summary: 取得片段詳情
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Snippet' } } } }
        '404': { description: Not Found }
    put:
      summary: 更新片段
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SnippetInput' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Snippet' } } } }
        '404': { description: Not Found }
    delete:
      summary: 刪除片段
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204': { description: No Content }
        '404': { description: Not Found }

components:
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }
    Settings:
      type: object
      required: [rootPath, attachmentPath]
      properties:
        rootPath: { type: string }
        attachmentPath: { type: string }
        tagsDict: { type: object }
        commonOptions:
          type: object
          description: 常用選項集合（key -> string[]）。例如：models、sources。
          additionalProperties:
            type: array
            items: { type: string }
        backup: { $ref: '#/components/schemas/BackupSettings' }
        trashRetentionDays: { type: integer, minimum: 1, description: '回收站自動清理保留天數（預設 30 天）' }
        updatedAt: { type: string, format: date-time }
    SettingsUpdate:
      type: object
      description: Settings 的 partial update（所有欄位皆為選填）
      properties:
        rootPath: { type: string }
        attachmentPath: { type: string }
        tagsDict: { type: object }
        commonOptions:
          type: object
          description: 常用選項集合（key -> string[]）。例如：models、sources。
          additionalProperties:
            type: array
            items: { type: string }
        backup: { $ref: '#/components/schemas/BackupSettings' }
        trashRetentionDays: { type: integer, minimum: 1 }
    BackupSettings:
      type: object
      properties:
        dailySnapshot: { type: boolean }
        schedule:
          type: string
          description: 每日時間（24 小時制，本機時區）
          pattern: '^(?:[01]\\d|2[0-3]):[0-5]\\d$'
        remote:
          type: string
          description: （保留欄位）遠端備份目的地/端點（未實作；目前僅保存設定值，不影響系統行為）。
    Project:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        summary: { type: string }
        status: { type: string, enum: [planned, in_progress, paused, done] }
        tags: { type: array, items: { type: string } }
        archived: { type: boolean }
        updatedAt: { type: string, format: date-time }
    ProjectInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
        summary: { type: string }
        status: { type: string, enum: [planned, in_progress, paused, done] }
        tags: { type: array, items: { type: string } }
    Prompt:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        title: { type: string }
        status: { type: string, enum: [draft, needs_review, ready, deprecated] }
        priority: { type: string, enum: [high, medium, low] }
        tags: { type: array, items: { type: string } }
        body: { type: string }
        notes: { type: string }
        attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
        updatedAt: { type: string, format: date-time }
    PromptInput:
      type: object
      required: [title]
      properties:
        projectId: { type: string }
        title: { type: string }
        status: { type: string, enum: [draft, needs_review, ready, deprecated] }
        priority: { type: string, enum: [high, medium, low] }
        tags: { type: array, items: { type: string } }
        body: { type: string }
        notes: { type: string }
    Attachment:
      type: object
      properties:
        id: { type: string }
        filename: { type: string }
        mimeType: { type: string }
        storagePath: { type: string }
    InboxItem:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        sourcePlatform: { type: string }
        sourceLink: { type: string }
        importedAt: { type: string, format: date-time }
        rawContent: { type: string }
        cleanedState: { type: string }
        notes: { type: string }
    InboxImport:
      type: object
      required: [title]
      properties:
        title: { type: string }
        sourcePlatform: { type: string }
        sourceLink: { type: string }
        rawContent: { type: string }
        suggestedTags: { type: array, items: { type: string } }
    SearchResult:
      type: object
      properties:
        id: { type: string }
        entityType: { type: string }
        title: { type: string }
        tags: { type: array, items: { type: string } }
        bodyExcerpt: { type: string }
        updatedAt: { type: string, format: date-time }
    VersionEvent:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        scope: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }
        snapshotPath: { type: string }
    SearchRequest:
      type: object
      properties:
        query: { type: string }
        includeArchived:
          type: boolean
          default: false
          description: 是否包含已封存（預設 false）
        includeInbox:
          type: boolean
          default: false
          description: 是否包含 InboxItem（預設 false）
        includeTrash:
          type: boolean
          default: false
          description: 是否包含 Trash（預設 false）
        entityTypes:
          type: array
          description: 要搜尋的實體類型（預設 [project,prompt]）
          items:
            type: string
            enum: [project, prompt]
        page: { type: integer }
        perPage: { type: integer }
    SearchResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SearchResult' }
        total: { type: integer }
        page: { type: integer }
        perPage: { type: integer }
        hasMore: { type: boolean }
    
    Snippet:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        content: { type: string }
        tags: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SnippetInput:
      type: object
      required: [title, content]
      properties:
        title: { type: string }
        content: { type: string }
        tags: { type: array, items: { type: string } }

    SnippetList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Snippet' }
        total: { type: integer }

    PathPermissions:
      type: object
      properties:
        readable: { type: boolean }
        writable: { type: boolean }
        error: { type: string }

    TrashItem:
      type: object
      properties:
        trashId: { type: string }
        entityType: { type: string, enum: [project, prompt, inboxItem, snippet, unknown] }
        entityId: { type: string }
        titleSnapshot: { type: string }
        deletedAt: { type: string, format: date-time }
        purgeAfter: { type: string, format: date-time }
        originalRelativePath: { type: string }
        attachmentsMoved: { type: boolean }

    TrashListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TrashItem' }
        total: { type: integer }
        page: { type: integer }
        perPage: { type: integer }
        hasMore: { type: boolean }

    TrashRestoreRequest:
      type: object
      required: [strategy]
      properties:
        strategy: { type: string, enum: [overwrite, rename] }
        newSlug: { type: string, description: '僅 strategy=rename 時使用；用於計算新的目的地路徑' }

    TrashRestoreResult:
      type: object
      properties:
        restored: { type: boolean }
        entityType: { type: string }
        entityId: { type: string }
        restoredRelativePath: { type: string }

    RestoreConflict:
      type: object
      properties:
        code: { type: string, example: 'RESTORE_CONFLICT' }
        message: { type: string }
        conflicts:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [entityPath, attachmentPath] }
              path: { type: string }
